name: Publish npm package

on:
  repository_dispatch:
    types: [hj-release-publish-tag-success]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing unprefixed SemVer tag
        required: true
        type: string

permissions:
  contents: read
  id-token: write

cache-mode: read

concurrency:
  group: hj-release-publish-npm-${{ github.event.client_payload.tag || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.releaseSha || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6
          cache: true
          cache-hash: deno-2.9.6-${{ hashFiles('**/deno.lock', 'toolchain.json') }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Select npm CLI
        run: npm install --global npm@11.11.1 --ignore-scripts
      - name: Configure Git authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git
      - env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HJ_RELEASE_ROUTE: ${{ github.event_name == 'repository_dispatch' && 'event' || 'user' }}
          HJ_RELEASE_SCHEMA: ${{ github.event.client_payload.schema }}
          HJ_RELEASE_SHA: ${{ github.event.client_payload.releaseSha }}
          HJ_RELEASE_TAG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag || inputs.tag }}
          HJ_RELEASE_VERSION: ${{ github.event.client_payload.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >-
          deno run --no-lock
          --allow-env=PATH,GITHUB_REPOSITORY,GITHUB_SHA,HJ_RELEASE_ROUTE,HJ_RELEASE_SCHEMA,HJ_RELEASE_SHA,HJ_RELEASE_TAG,HJ_RELEASE_VERSION
          --allow-read=.
          --allow-net=registry.npmjs.org
          --allow-run=deno,git,npm,tar
          --import-map=https://raw.githubusercontent.com/hugojosefson/cli/64888f130eeb3cf2a6a9dad9e6360051e01af00d/deno.json https://raw.githubusercontent.com/hugojosefson/cli/64888f130eeb3cf2a6a9dad9e6360051e01af00d/src/cli/cli.ts
          release publish-npm
