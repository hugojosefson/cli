name: Publish GitHub Release

on:
  repository_dispatch:
    types: [hj-release-publish-tag-success]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing unprefixed SemVer tag
        required: true
        type: string

permissions:
  contents: write

cache-mode: read

concurrency:
  group: hj-release-publish-github-${{ github.event.client_payload.tag || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish-github:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.releaseSha || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6
          cache: true
          cache-hash: deno-2.9.6-${{ hashFiles('**/deno.lock', 'toolchain.json') }}
      - name: Configure Git authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git
      - env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HJ_RELEASE_ROUTE: ${{ github.event_name == 'repository_dispatch' && 'event' || 'user' }}
          HJ_RELEASE_SCHEMA: ${{ github.event.client_payload.schema }}
