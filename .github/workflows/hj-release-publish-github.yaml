          --allow-read=.
          --allow-run=gh,git
          --import-map=https://raw.githubusercontent.com/hugojosefson/cli/f43b1c8419ab3400e3cc79216a9f6c7571804f1b/deno.json https://raw.githubusercontent.com/hugojosefson/cli/f43b1c8419ab3400e3cc79216a9f6c7571804f1b/src/cli/cli.ts
          release publish-github
